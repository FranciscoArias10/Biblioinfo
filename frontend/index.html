<!doctype html>
<html lang="es" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primaria SEO Meta Tags -->
    <title>Biblioinfo — Descubre tu próxima lectura a través de ojos apasionados</title>
    <meta
      name="title"
      content="Biblioinfo — Descubre tu próxima lectura a través de ojos apasionados"
    />
    <meta
      name="description"
      content="Biblioinfo es una plataforma web interactiva de reseñas literarias. Descubre opiniones sinceras de la comunidad, explora un catálogo de libros y comparte tus propias críticas."
    />
    <meta
      name="keywords"
      content="reseñas de libros, literatura, críticas literarias, catálogo de libros, recomendaciones literarias, comunidad de lectores, Biblioinfo, novelas, clásicos"
    />
    <meta name="author" content="Danilo, Darly, Francisco, Gabriel — Equipo Biblioinfo" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#E08738" />
    <link rel="canonical" href="http://localhost:5173/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Biblioinfo" />
    <meta property="og:url" content="http://localhost:5173/" />
    <meta
      property="og:title"
      content="Biblioinfo — Descubre tu próxima lectura a través de ojos apasionados"
    />
    <meta
      property="og:description"
      content="Plataforma de reseñas literarias escritas por lectores reales. Explora opiniones, filtra por género literario y comparte tus críticas."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="http://localhost:5173/" />
    <meta
      name="twitter:title"
      content="Biblioinfo — Plataforma de Reseñas Literarias"
    />
    <meta
      name="twitter:description"
      content="Descubre tu próxima lectura con reseñas honestas de la comunidad de lectores."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Google Fonts: Merriweather & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Datos Estructurados JSON-LD (Schema.org) para Motores de Búsqueda -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Biblioinfo",
        "url": "http://localhost:5173/",
        "description": "Plataforma de reseñas literarias y catálogo de libros construida con React y Node.js Express.",
        "inLanguage": "es",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "http://localhost:5173/lista?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body class="font-sans antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
